<!doctype html>
<html lang="nb">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
		<!-- .ico for eldre nettlesere og for oppsamlere som ber om /favicon.ico
		     paa roten uansett hva som staar her. Svarte 404 fram til 2. september 2026. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
		<!-- iOS bruker denne paa hjemskjermen. Den er flat og uten
		     gjennomsiktighet med vilje: iOS klipper hjoernene selv, og det som
		     er gjennomsiktig blir svart. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<!-- Farger nettleserens egen ramme rundt sida. Foelger fargemodus, saa
		     ramma smelter sammen med bakgrunnen i stedet for aa lyse mot den. -->
		<meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="max-image-preview:large" />
		<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="google-site-verification" content="Cqs06hSFIvk6n3dPkQ9305hVW_CCQ3Y6mbN8Gun9-Qw" />
	<!-- Privacy-friendly analytics by Umami -->
		<script defer src="/u/script.js" data-website-id="5f889214-285b-4412-8066-015a18f8ce65" data-host-url="/u"></script>
		<!-- AI referral tracking: fires custom event when visitor arrives from an AI search platform -->
		<script>window.addEventListener('load',function(){var r=document.referrer;if(!r||!window.umami)return;var d=['chatgpt.com','chat.openai.com','perplexity.ai','claude.ai','gemini.google.com','copilot.microsoft.com','deepseek.com','you.com','phind.com','meta.ai'];for(var i=0;i<d.length;i++){if(r.indexOf(d[i])!==-1){umami.track('ai-referral',{source:d[i]});break;}}})</script>
		<!-- UTM attribution: parse utm_source/medium/campaign from URL and fire as custom event -->
		<script>window.addEventListener('load',function(){if(!window.umami)return;var p=new URLSearchParams(window.location.search);var s=p.get('utm_source');if(s){umami.track('utm-visit',{source:s,medium:p.get('utm_medium')||'',campaign:p.get('utm_campaign')||''});}})</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
