name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Load CI env vars
        run: cp .env.ci .env

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Tilgjengelighet. Egne steg fordi nettleseren maa lastes ned foerst, og
      # fordi et rødt resultat her betyr noe annet enn en feilende enhetstest:
      # det betyr at den publiserte erklæringen paa /tilgjengelighet ikke lenger
      # stemmer. Rapporten lastes opp slik at bruddet kan leses uten aa kjøre
      # alt paa nytt lokalt.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core, WCAG 2.2 AA)
        run: npm run test:a11y

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
