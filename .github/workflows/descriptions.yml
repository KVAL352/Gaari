name: Enrich Descriptions

# Berikelse av beskrivelser, skilt fra innhentingen med vilje.
#
# 26. august ble scrape.yml drept av tidsavbruddet paa 25 minutter fordi
# beskrivelsene ble beriket inne i scrapen. Dagen foer tok den 20m22s.
# Innhentingen skal vaere rask og komplett; berikelsen taaler aa ta tid.
#
# Kjoerer en time etter scrapen, saa dagens nye arrangementer er inne.
# Egen jobb betyr ogsaa at en feil her ikke stopper innhentingen i morgen.
#
# Jobben er idempotent: den plukker bare rader med beskrivelse under 170
# tegn. En avbrutt kjoering kan startes paa nytt uten aa gjoere noe om igjen,
# og en kjoering som ikke rekker alt tar resten i morgen.

on:
  schedule:
    # 07:00 UTC — en time etter scrapen
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maks antall arrangementer'
        required: false
        default: '300'
      source:
        description: 'Bare én kilde (valgfritt)'
        required: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # Romslig, men ikke uendelig. Hver rad er én forespoersel hos arrangoeren
    # pluss to Gemini-kall, saa 300 rader tar rundt 25-35 minutter.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install scraper dependencies
        working-directory: scripts
        run: npm ci
        timeout-minutes: 2

      - name: Enrich descriptions from source pages
        working-directory: scripts
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx backfill-descriptions-from-source.ts --limit ${{ github.event.inputs.limit || '300' }} ${{ github.event.inputs.source && format('--source {0}', github.event.inputs.source) || '' }}

      # Engelske titler for det som kom inn i dag. Satsvis, saa den koster
      # faa kall og gaar paa under et minutt.
      - name: Backfill English titles
        if: always()
        working-directory: scripts
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx backfill-title-en.ts
